{{- if eq .Values.experimental.mounterMode "daemonset" }}
{{- include "s3.validateMounters" . }}
{{- $root := . }}
{{- range $idx, $mounter := .Values.daemonsetMounters }}
{{- $suffix := "" }}
{{- if not (empty $mounter.nodeSelectorValue) }}
{{-   $suffix = printf "-%s" (include "s3.mounterNameSuffix" (dict "value" $mounter.nodeSelectorValue)) }}
{{- end }}
---
kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: {{ printf "s3-csi-daemonset-mounter%s" $suffix | trunc 63 | trimSuffix "-" }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "aws-mountpoint-s3-csi-driver.labels" $root | nindent 4 }}
spec:
  updateStrategy:
    # We use OnDelete strategy because restarting this pod disrupts ALL active mounts on the node.
    # Mounter pods will continue running the previous version until the pod is manually restarted.
    type: OnDelete
  selector:
    matchLabels:
      app: s3-csi-daemonset-mounter
      s3.csi.aws.com/mounter-class: {{ $mounter.nodeSelectorValue | default "default" | quote }}
      {{- include "aws-mountpoint-s3-csi-driver.selectorLabels" $root | nindent 6 }}
  template:
    metadata:
      labels:
        app: s3-csi-daemonset-mounter
        s3.csi.aws.com/mounter-class: {{ $mounter.nodeSelectorValue | default "default" | quote }}
        {{- include "aws-mountpoint-s3-csi-driver.labels" $root | nindent 8 }}
        {{- with $mounter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # The mounter runs mount-s3 only; it needs no node network namespace. With hostNetwork: false
      # IMDS (169.254.169.254) is unreachable unless the node's IMDS hop limit is >= 2, keeping node
      # credentials out of reach of this unprivileged pod.
      hostNetwork: false
      # The mounter never calls the Kubernetes API, so it needs no ServiceAccount token mounted.
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        {{- with $root.Values.node.nodeSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if not (empty $mounter.nodeSelectorValue) }}
        {{ $root.Values.daemonsetMounterLabelKey }}: {{ $mounter.nodeSelectorValue | quote }}
        {{- end }}
      priorityClassName: system-node-critical
      {{- $mounterAff := include "s3.mounterAffinity" (dict "root" $root "mounter" $mounter) }}
      {{- if $mounterAff | trim }}
      affinity:
        {{- $mounterAff | nindent 8 }}
      {{- end }}
      tolerations:
        {{- if $mounter.tolerateAllTaints | default $root.Values.node.tolerateAllTaints }}
        - operator: Exists
        {{- else if $mounter.defaultTolerations | default $root.Values.node.defaultTolerations }}
        - key: CriticalAddonsOnly
          operator: Exists
        - key: s3.csi.aws.com/agent-not-ready
          operator: Exists
        - operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        {{- end }}
        {{- with $mounter.tolerations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $mounter.imagePullSecrets }}
      imagePullSecrets:
      {{- range . }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
      - name: mounter
        image: {{ include "csiDriverImageName" $root }}
        imagePullPolicy: {{ $root.Values.image.pullPolicy }}
        command:
          - /bin/aws-s3-csi-daemonset-mounter
        args:
          - --comm-dir=/comm
          - --mountpoint-bin-dir=/mountpoint-s3/bin
          - --v={{ $mounter.logLevel }}
        securityContext:
          runAsUser: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: comm
            mountPath: /comm
        {{- with $mounter.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      volumes:
      - name: comm
        emptyDir: {}
{{- end }}
{{- end }}
